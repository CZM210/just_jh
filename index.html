<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<title>古城探索JH（手機版）</title>
<style>
  :root{
    --bg:#15130f; --bar:#1b1916;
    --gold:#d8b46a; --gold-dim:#8a7140;
    --paper:#cdc3b8; --paper2:#e4ddd4; --paper-edge:#8f8478;
    --ink:#3a332c; --ink-soft:#6b6056;
    --red:#c0281f; --purple:#8b2fa0;
    --hi:#e7c73a; --blue:#2f8fd8; --orange:#e08a1e; --green:#2e7d1e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html,body{ margin:0 }
  body{
    min-height:100dvh; color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(0,0,0,.35) 46px 48px),
      repeating-linear-gradient(90deg, transparent 0 94px, rgba(0,0,0,.25) 94px 96px),
      var(--bg);
    touch-action:manipulation;
  }
  button{ font-family:inherit; touch-action:manipulation }

  /* ── 上方固定列 ── */
  .top{
    position:sticky; top:0; z-index:10;
    background:var(--bar); border-bottom:2px solid var(--gold-dim);
    padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;
    box-shadow:0 4px 14px rgba(0,0,0,.6);
  }
  .title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px }
  .title-row h1{ margin:0; font-size:18px; color:var(--gold); letter-spacing:.12em }
  .btn-all{
    min-height:36px; padding:0 12px; font-size:14px; border-radius:6px;
    background:transparent; color:#cfc3ae; border:1px solid #5d5243;
  }
  .tabs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px }
  .tab{
    min-height:58px; padding:6px 4px; border-radius:8px;
    background:#2a2722; color:#cfc3ae; border:2px solid #4a4237;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .tab .t-name{ font-size:16px; font-weight:bold; letter-spacing:.08em }
  .tab .t-sum{ font-size:12px; color:#9a8e7b; white-space:nowrap }
  .tab .t-sum b{ color:#8fd46a; font-size:13px }
  .tab.on{ background:var(--paper); color:var(--ink); border-color:var(--gold) }
  .tab.on .t-sum{ color:var(--ink-soft) }
  .tab.on .t-sum b{ color:var(--green) }

  /* ── 主面板 ── */
  main{ padding:14px 12px calc(env(safe-area-inset-bottom) + 28px); max-width:560px; margin:0 auto }
  .panel{
    background:var(--paper); border:2px solid #a89c8f; border-radius:6px;
    padding:14px 12px; box-shadow:0 8px 24px rgba(0,0,0,.55);
  }
  .panel-title{
    text-align:center; margin:-14px -12px 12px; padding:10px;
    background:#1b1a18; color:var(--gold); font-size:19px; letter-spacing:.2em;
    border-bottom:3px solid var(--gold-dim); border-radius:4px 4px 0 0;
  }

  .step{ margin-bottom:14px }
  .step-h{ font-size:13px; color:var(--ink-soft); margin:0 0 8px; font-weight:normal }
  .step-h b{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%;
             background:var(--ink); color:var(--paper); font-size:12px; margin-right:6px }

  /* 收合後的一行 */
  .picked{
    display:flex; align-items:center; gap:10px; width:100%; min-height:48px;
    padding:8px 10px; text-align:left; border-radius:6px;
    background:var(--paper2); border:1px solid var(--paper-edge); color:var(--ink);
  }
  .picked .p-label{ font-size:12px; color:var(--ink-soft); white-space:nowrap }
  .picked .p-val{ flex:1; font-size:16px; font-weight:bold }
  .picked .p-chg{ font-size:13px; color:#1f6fb2; white-space:nowrap }

  .chips{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px }
  .chip{
    min-height:48px; padding:8px 10px; border-radius:6px; text-align:left;
    background:var(--paper2); border:1px solid var(--paper-edge); color:var(--ink);
    font-size:15px; line-height:1.3;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .chip small{ color:var(--ink-soft); font-size:12px }
  .chip:active{ background:#fff8e6 }

  .choices{ display:flex; flex-direction:column; gap:8px }
  .choice{
    width:100%; text-align:left; padding:12px 12px 12px 14px; border-radius:6px;
    background:var(--paper2); color:var(--ink);
    border:1px solid var(--paper-edge); border-left:6px solid var(--paper-edge);
  }
  .choice.c-y{ border-left-color:var(--hi) }
  .choice.c-b{ border-left-color:var(--blue) }
  .choice.c-o{ border-left-color:var(--orange) }
  .choice.on{ background:#fff8e6; box-shadow:0 0 0 2px var(--gold-dim) }
  .c-text{ display:block; font-size:16px; line-height:1.65 }
  .kw{ color:var(--red); font-weight:bold }
  .c-meta{ display:flex; justify-content:space-between; margin-top:6px; font-size:13px; color:var(--ink-soft) }
  .choice.on .c-meta::after{ content:"✔ 已選擇"; color:var(--green); font-weight:bold }

  /* 結果 */
  .result{ margin-top:4px; padding-top:14px; border-top:1px dashed #9d9184 }
  .r-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .stat{ background:var(--paper2); border:1px solid #a89c8f; border-radius:6px; padding:10px 6px; text-align:center }
  .stat .k{ font-size:12px; color:var(--ink-soft) }
  .stat .v{ font-size:26px; font-weight:bold; margin-top:2px }
  .stat.jade .v{ color:#2b7a5b; font-size:22px; line-height:1.35 }
  .stat.clue .v{ color:var(--green) }
  .stat.hi{ box-shadow:inset 0 0 0 3px var(--hi) }
  .cost{
    grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 12px;
    background:var(--paper2); border:1px solid #a89c8f; border-radius:6px; padding:10px; font-size:17px;
  }
  .plus{ color:#1f6fb2; font-weight:bold } .minus{ color:var(--purple); font-weight:bold }
  .zero{ color:var(--ink-soft); font-weight:bold; font-size:15px }
  .battle{ color:var(--red); font-weight:bold }
  .tag{ grid-column:1 / -1; text-align:center; font-size:14px; padding:7px; border-radius:6px; color:#fff }
  .tag.y{ background:#b39412 } .tag.b{ background:var(--blue) } .tag.o{ background:var(--orange) }

  .actions{ display:flex; gap:10px; margin-top:14px }
  .actions button{ flex:1; min-height:48px; font-size:16px; border-radius:6px; letter-spacing:.08em }
  .btn-reset{ background:#c2b5a3; color:var(--ink); border:2px solid #8f8070 }
  .btn-next{ background:#8fa8cc; color:#1c2533; border:2px solid #4f6a92 }

  .tip{ text-align:center; color:#8a7f73; font-size:14px; padding:6px 0 2px }
</style>
</head>

  <div class="title-row">
    <h1>古城遺跡・探索查詢</h1>

["Z","腳步聲","6",13,"這條通道裡傳來緩緩的腳步聲","燈油-1","y",0],
["Z","氣味","11",12,"這條通道漆黑而靜謐，氣味難聞，時不時還有蝙蝠飛竄，通道上的蜘蛛網也佈滿了灰塵","燈油-1","g",0],
["Z","氣味","5",11,"這條通道漆黑而靜謐，氣味難聞，通道上方還有諸多蛛網，如果從這裡路過，免不了沾一身灰塵了","燈油-1","g",0],
["Z","氣味","6",8,"這條通道漆黑而靜謐，氣味難聞，時不時還有蝙蝠飛竄，實在有些瘆得慌，這樣的地方，會藏有寶物？","燈油-1","g",0],
["Z","水滴聲","7、9",11,"這條通道裡傳來滴答滴答的水滴聲","燈油-1","g",0],
["Z","廟宇","12、13",9,"這裡竟有一座廟宇立於道路中間","燈油-1","g",0],
["Z","石墩","15、16",9,"這條道路兩側皆是殘垣斷壁，就連沿途的石墩已經悉數倒塌","燈油-1","g",1],
["Z","高牆","7、8",8,"這條路的盡頭似乎是一座高牆","燈油-1","g",0],
];

/* 提示話語開頭的詞（依注音順序排列） */
const OPENERS = [
  "道路的前方",
  "通道中間", "通道裡",
  "你順著火光", "你在通道的盡頭", "你在角落中",
  "借助火光", "幾隻老鼠",
  "前方", "漆黑的通道",
  "這條通道", "這條道路", "這條路", "這裡竟有",
  "此處",
  "一道", "一隻", "一些", "依靠著火光", "眼前的通道",
  "遠遠望去",
];
const OPENERS_BY_LEN = [...OPENERS].sort((a, b) => b.length - a.length);
const openerOf = t => OPENERS_BY_LEN.find(o => t.startsWith(o)) || "其他";

/* 關鍵詞注音，用來排序 */
const KW_ZY = {
  "通道":"ㄊㄨㄥ ㄉㄠˋ", "開闊地":"ㄎㄞ ㄎㄨㄛˋ ㄉㄧˋ", "窪地":"ㄨㄚ ㄉㄧˋ", "大殿":"ㄉㄚˋ ㄉㄧㄢˋ",
  "樓牌":"ㄌㄡˊ ㄆㄞˊ", "廳堂":"ㄊㄧㄥ ㄊㄤˊ", "牆壁":"ㄑㄧㄤˊ ㄅㄧˋ", "廢墟":"ㄈㄟˋ ㄒㄩ",
  "屍骸":"ㄕ ㄏㄞˊ", "圖案":"ㄊㄨˊ ㄢˋ", "閣樓":"ㄍㄜˊ ㄌㄡˊ", "高臺":"ㄍㄠ ㄊㄞˊ",
  "廟宇":"ㄇㄧㄠˋ ㄩˇ", "地磚":"ㄉㄧˋ ㄓㄨㄢ", "地窖":"ㄉㄧˋ ㄐㄧㄠˋ", "探寶者":"ㄊㄢˋ ㄅㄠˇ ㄓㄜˇ",
  "人影":"ㄖㄣˊ ㄧㄥˇ", "祭壇":"ㄐㄧˋ ㄊㄢˊ", "漆黑的通道":"ㄑㄧ ㄏㄟ ㄉㄜ ㄊㄨㄥ ㄉㄠˋ",
  "石屋":"ㄕˊ ㄨ", "石像":"ㄕˊ ㄒㄧㄤˋ", "裂縫":"ㄌㄧㄝˋ ㄈㄥˋ", "死路":"ㄙˇ ㄌㄨˋ",
  "石樓":"ㄕˊ ㄌㄡˊ", "石墩":"ㄕˊ ㄉㄨㄣ", "石柱":"ㄕˊ ㄓㄨˋ", "庭院":"ㄊㄧㄥˊ ㄩㄢˋ",
  "喘息聲":"ㄔㄨㄢˇ ㄒㄧ ㄕㄥ", "亮光":"ㄌㄧㄤˋ ㄍㄨㄤ", "花紋":"ㄏㄨㄚ ㄨㄣˊ", "聲響":"ㄕㄥ ㄒㄧㄤˇ",
  "壁畫":"ㄅㄧˋ ㄏㄨㄚˋ", "塔樓":"ㄊㄚˇ ㄌㄡˊ", "石室":"ㄕˊ ㄕˋ", "腳步聲":"ㄐㄧㄠˇ ㄅㄨˋ ㄕㄥ",
  "氣味":"ㄑㄧˋ ㄨㄟˋ", "水滴聲":"ㄕㄨㄟˇ ㄉㄧ ㄕㄥ", "高牆":"ㄍㄠ ㄑㄧㄤˊ",
};
const ZY_ORDER = " ˊˇˋㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ";
function zyCompare(a, b){
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i++){
    const x = i < a.length ? ZY_ORDER.indexOf(a[i]) : -1;
    const y = i < b.length ? ZY_ORDER.indexOf(b[i]) : -1;
    if (x !== y) return x - y;
  }
  return 0;
}

const DATA = RAW.map(([, kw, jade, clue, text, cost, type, jadeHi], i) =>
  ({ id:i, op:openerOf(text), kw, jade, clue, text, cost, type, jadeHi:!!jadeHi }));
const OPS = [...OPENERS, "其他"].filter(o => DATA.some(d => d.op === o));

const DIRS = [
  { key:"left",  short:"← 左", name:"向左探索" },
  { key:"up",    short:"↑ 上", name:"向上探索" },
  { key:"right", short:"→ 右", name:"向右探索" },
];

/* ── 狀態（存在瀏覽器，重新整理不會不見） ── */
const STORE = "gucheng-mobile-v1";
const blank = () => ({ op:null, kw:null, id:null });
let state = { active:"up", sel:{ left:blank(), up:blank(), right:blank() } };
try {
  const s = JSON.parse(localStorage.getItem(STORE));
  if (s && s.sel) state = s;
} catch(e){}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} };

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const markKw = d => esc(d.text).split(esc(d.kw)).join(`<span class="kw">${esc(d.kw)}</span>`);

/* 只剩一個選項時自動帶入 */
function autoFill(sel){
  if (sel.op && !sel.kw){
    const kws = [...new Set(DATA.filter(d => d.op === sel.op).map(d => d.kw))];
    if (kws.length === 1) sel.kw = kws[0];
  }
  if (sel.op && sel.kw && sel.id === null){
    const rows = DATA.filter(d => d.op === sel.op && d.kw === sel.kw);
    if (rows.length === 1) sel.id = rows[0].id;
  }
}

/* ── 畫面 ── */
const tabsEl = document.getElementById("tabs");
const panel = document.getElementById("panel");

function renderTabs(){
  tabsEl.innerHTML = DIRS.map(d => {
    const s = state.sel[d.key];
    const r = s.id !== null ? DATA[s.id] : null;
    const sum = r ? `<b>${r.clue}%</b>・碎玉 ${esc(r.jade.split("、")[0])}${r.jade.includes("、") ? "+" : ""}` : "未選";
    return `<button class="tab${state.active === d.key ? " on" : ""}" data-k="${d.key}">
      <span class="t-name">${d.short}</span><span class="t-sum">${sum}</span></button>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    state.active = b.dataset.k; save(); render(); window.scrollTo({ top:0 });
  });
}

function resultHtml(d){
  const oilM = d.cost.match(/燈油([+-]\d+)/);
  const battle = d.cost.match(/觸發戰鬥（(.+?)）/);
  const oil = oilM
    ? (n => `🏺 燈油 <span class="${n > 0 ? "plus" : "minus"}">${n > 0 ? "+" + n : n}</span>`)(+oilM[1])
    : `🏺 <span class="zero">${esc(d.cost)}</span>`;
  const tags = { y:"線索較高", b: oilM ? "加燈油" : "不消耗燈油", o:"消耗較多燈油" };
  return `<div class="result"><div class="r-grid">
    <div class="stat jade${d.jadeHi ? " hi" : ""}"><div class="k">獲取碎玉</div><div class="v">${esc(d.jade)}</div></div>
    <div class="stat clue${d.type === "y" ? " hi" : ""}"><div class="k">獲取線索</div><div class="v">${d.clue}%</div></div>
    <div class="cost"><span>${oil}</span>${battle ? `<span class="battle">⚔ 觸發戰鬥（${esc(battle[1])}）</span>` : ""}</div>
    ${tags[d.type] ? `<div class="tag ${d.type}">${tags[d.type]}</div>` : ""}
  </div></div>`;
}

function renderPanel(){
  const dir = DIRS.find(d => d.key === state.active);
  const sel = state.sel[dir.key];
  autoFill(sel);
  let h = `<div class="panel-title">${dir.name}</div>`;

  /* ① 開頭的詞 */
  if (!sel.op){
    h += `<div class="step"><h2 class="step-h"><b>1</b>提示話語開頭的詞</h2><div class="chips">` +
      OPS.map(o => `<button class="chip" data-op="${esc(o)}"><span>${esc(o)}…</span>
        <small>${DATA.filter(d => d.op === o).length}</small></button>`).join("") + `</div></div>`;
  } else {
    h += `<div class="step"><button class="picked" data-clear="op"><span class="p-label">開頭</span>
      <span class="p-val">${esc(sel.op)}…</span><span class="p-chg">更換</span></button></div>`;

    /* ② 關鍵詞 */
    const rowsOp = DATA.filter(d => d.op === sel.op);
    const kws = [...new Set(rowsOp.map(d => d.kw))].sort((a, b) => zyCompare(KW_ZY[a] || "", KW_ZY[b] || ""));
    if (!sel.kw){
      h += `<div class="step" id="step2"><h2 class="step-h"><b>2</b>提示關鍵詞（紅字）</h2><div class="chips">` +
        kws.map(k => `<button class="chip" data-kw="${esc(k)}"><span>${esc(k)}</span>
          <small>${rowsOp.filter(r => r.kw === k).length}</small></button>`).join("") + `</div></div>`;
    } else {
      if (kws.length > 1){
        h += `<div class="step"><button class="picked" data-clear="kw"><span class="p-label">關鍵詞</span>
          <span class="p-val" style="color:var(--red)">${esc(sel.kw)}</span><span class="p-chg">更換</span></button></div>`;
      }
      /* ③ 提示話語 */
      const rows = rowsOp.filter(d => d.kw === sel.kw);
      h += `<div class="step" id="step3"><h2 class="step-h"><b>${kws.length > 1 ? 3 : 2}</b>點選相符的提示話語</h2><div class="choices">` +
        rows.map(r => `<button class="choice c-${r.type}${sel.id === r.id ? " on" : ""}" data-id="${r.id}">
          <span class="c-text">${markKw(r)}</span>
          <span class="c-meta"><span>碎玉 ${esc(r.jade)}　線索 ${r.clue}%</span></span></button>`).join("") +
        `</div></div>`;
      if (sel.id !== null) h += `<div id="result">${resultHtml(DATA[sel.id])}</div>`;
    }
  }

  if (!sel.op) h += `<div class="tip">對照遊戲視窗中提示話語的開頭來選擇</div>`;

  const idx = DIRS.indexOf(dir);
  const next = DIRS.find((d, i) => i !== idx && state.sel[d.key].id === null);
  h += `<div class="actions"><button class="btn-reset" data-act="reset">重設此方向</button>
    ${sel.id !== null && next ? `<button class="btn-next" data-act="next" data-k="${next.key}">下一個：${next.short}</button>` : ""}</div>`;

  panel.innerHTML = h;

  panel.querySelectorAll("[data-op]").forEach(b => b.onclick = () => {
    sel.op = b.dataset.op; sel.kw = null; sel.id = null; update("#step2, #step3");
  });
  panel.querySelectorAll("[data-kw]").forEach(b => b.onclick = () => {
    sel.kw = b.dataset.kw; sel.id = null; update("#step3");
  });
  panel.querySelectorAll("[data-id]").forEach(b => b.onclick = () => {
    sel.id = +b.dataset.id; update("#result");
  });
  panel.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => {
    if (b.dataset.clear === "op"){ sel.op = null; }
    sel.kw = null; sel.id = null; update();
  });
  panel.querySelector('[data-act="reset"]').onclick = () => {
    state.sel[dir.key] = blank(); update(); window.scrollTo({ top:0 });
  };
  const nb = panel.querySelector('[data-act="next"]');
  if (nb) nb.onclick = () => { state.active = nb.dataset.k; update(); window.scrollTo({ top:0 }); };
}

/* 重畫並把下一步捲到可見位置 */
function update(scrollSel){
  save(); render();
  if (!scrollSel) return;
  const t = panel.querySelector(scrollSel);
  if (t){
    const topH = document.querySelector(".top").offsetHeight;
    const y = t.getBoundingClientRect().top + window.scrollY - topH - 10;
    window.scrollTo({ top:y, behavior:"smooth" });
  }
}

function render(){ renderTabs(); renderPanel(); }

document.getElementById("resetAll").onclick = () => {
  state = { active:"up", sel:{ left:blank(), up:blank(), right:blank() } };
  save(); render(); window.scrollTo({ top:0 });
};

render();
</script>
</body>
</html>
